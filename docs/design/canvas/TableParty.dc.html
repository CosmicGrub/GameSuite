<!doctype html>

<helmet>

.bar{flex:1;height:14px;border-radius:7px;background:#232943;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}

<div style="flex:1"><div style="display:flex;justify-content:space-between;font:600 12px Inter;color:#C9CDE0;margin-bottom:6px"><span>Mint 17</span><span style="font:700 18px Sora;color:#fff;font-variant-numeric:tabular-nums">0:12</span><span>Saffron 21</span></div>
<div class="bar"><i style="width:45%;background:#14A58A"></i><i style="left:auto;right:0;width:55%;background:#FFB547"></i></div></div>
</div>
