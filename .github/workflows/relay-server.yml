# CI for the GameSuite relay server (server/) — the backend for
# OnlineTransport, see server/README.md. Runs the self-contained smoke test
# (server/smoke-test.js spawns its own server instance) on every change to
# the server so protocol regressions and crash/room-leak fixes stay caught
# before merge, without needing anything else running in CI.
name: Relay server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      # server/seat-ranges.json is generated from these Kotlin specs; the server tests check it is fresh
      - 'app/src/main/java/com/gamesuite/core/GameHubSpecs.kt'
      - 'app/src/main/java/com/gamesuite/games/**/*HubSpecs.kt'
      - '.github/workflows/relay-server.yml'
  pull_request:
    paths:
      - 'server/**'
      # server/seat-ranges.json is generated from these Kotlin specs; the server tests check it is fresh
      - 'app/src/main/java/com/gamesuite/core/GameHubSpecs.kt'
      - 'app/src/main/java/com/gamesuite/games/**/*HubSpecs.kt'
      - '.github/workflows/relay-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # The smoke test finishes in seconds; without this a hang would run for GitHub's 6 hour default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm test

  # Builds the relay image from server/Dockerfile without pushing it, so a broken Dockerfile or a
  # missing file in the build context fails here and not on the first deploy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: docker build (no push)
        run: docker build --tag gamesuite-relay:ci server/
