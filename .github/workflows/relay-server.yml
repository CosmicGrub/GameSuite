# CI for the GameSuite relay server (server/) — the backend for
# OnlineTransport, see server/README.md. Runs the self-contained smoke test
# (server/smoke-test.js spawns its own server instance) on every change to
# the server so protocol regressions and crash/room-leak fixes stay caught
# before merge, without needing anything else running in CI.
name: Relay server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/relay-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/relay-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm test
