org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# :shared wires its own explicit jvmMain intermediate source set (androidMain/desktopMain
# both dependsOn it -- see shared/build.gradle.kts) for LanMultiplayerTransport's real JVM
# socket code, shared between the androidTarget and jvm("desktop") compilations. Kotlin's
# own default hierarchy template doesn't create a shared source set for a custom-named
# jvm("desktop") target, so it has nothing to conflict with here in practice -- but Kotlin's
# own build-time warning explicitly recommends this flag whenever explicit dependsOn edges
# are configured, so set here rather than left as a standing warning on every build.
kotlin.mpp.applyDefaultHierarchyTemplate=false
